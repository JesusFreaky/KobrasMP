l_english:
 kob_bi.1.t:0 "Austria and the Burgundian Succession"
 kob_bi.1.d:0 "Marie has taken the Burgundian throne and preserved the realm's independence. Vienna must decide whether to press Habsburg claims over Burgundy's Imperial lands or recognize Marie's succession and seek a closer understanding with Burgundy."
 kob_bi.1.a:0 "Assert our rights in the Empire"
 kob_bi.1.b:0 "Recognize Marie's Burgundy"
 kob_bi.2.t:0 "France and the Burgundian Succession"
 kob_bi.2.d:0 "Marie has taken the Burgundian throne and preserved the realm's independence. Burgundy will not fall beneath a foreign crown, but the succession renews French claims throughout the French realm."
 kob_bi.2.a:0 "Assert our rights in France"
 kob_burgundian_succession_france_pp:0 "Claims in the Burgundian Succession"
 kob_hab_burgundy_friendly:0 "Recognized Marie's Burgundy"
