l_english:
 kob_bi.1.t:0 "Austria and the Burgundian Succession"
 kob_bi.1.d:0 "Marie has taken the Burgundian throne and preserved the realm's independence. Vienna will not intervene automatically, but the Habsburgs retain their ambitions over Burgundy's Imperial lands."
 kob_bi.1.a:0 "Assert our rights in the Empire"
 kob_bi.2.t:0 "France and the Burgundian Succession"
 kob_bi.2.d:0 "Marie has taken the Burgundian throne and preserved the realm's independence. Burgundy will not fall beneath a foreign crown, but France retains its claims to Burgundian lands within the French realm."
 kob_bi.2.a:0 "Assert our rights in France"
 kob_burgundian_succession_france_pp:0 "Claims in the Burgundian Succession"
