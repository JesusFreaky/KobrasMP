l_english:
 kob_pap_guard_of_saint_peter_reform:0 "Guard of Saint Peter"
 kob_pap_guard_of_saint_peter_reform_desc:0 "The Holy See shall maintain a permanent military doctrine devoted to the defense of Saint Peter's patrimony and the wider interests of the Church. Adopting this doctrine enables Cawa regiments for the Papal State and begins Stage I of the Guard of Saint Peter."

 kob_pap_guard_of_saint_peter_title:0 "Guard of Saint Peter"
 kob_pap_guard_of_saint_peter_desc:0 "The temporal power of the Holy See requires soldiers bound not merely by pay, but by duty to the Church. Completing this mission unlocks the §YGuard of Saint Peter§! Military Doctrine. Adopting that doctrine enables Cawa regiments and begins §YStage I§! of the Guard."

 kob_pap_arms_of_holy_see_title:0 "Arms of the Holy See"
 kob_pap_arms_of_holy_see_desc:0 "The Guard must grow from a protected institution into a dependable arm of Papal power. Completing this mission advances the Guard of Saint Peter to §YStage II§!."

 kob_pap_unbroken_guard_title:0 "The Unbroken Guard"
 kob_pap_unbroken_guard_desc:0 "Through discipline, endurance and repeated service in defense of the Church, the Guard has become a force that will not yield. Completing this mission advances the Guard of Saint Peter to §YStage III§!."

 kob_pap_soldiers_of_holy_league_title:0 "Soldiers of the Holy League"
 kob_pap_soldiers_of_holy_league_desc:0 "The Guard now stands at the heart of the Papacy's military leadership of Christendom, ready to fight beside the armies of the Holy League. Completing this mission advances the Guard of Saint Peter to §YStage IV§!, the final stage of its development."
