 # Military, Balkans and Africa
 kob_pap_catholic_volunteers_title: "Catholic Volunteers"
 kob_pap_catholic_volunteers_desc: "Maintain the manpower and organization needed to receive volunteers in defense of the Church."
 kob_pap_roman_navy_title: "The Roman Navy"
 kob_pap_roman_navy_desc: "Build a navy capable of protecting Papal interests in the Mediterranean."
 kob_pap_eastern_correspondence_title: "Eastern Correspondence"
 kob_pap_eastern_correspondence_desc: "Develop relations with Christian states facing pressure in the eastern Mediterranean and Balkans."
 kob_pap_balkan_christians_title: "The Balkan Christians"
 kob_pap_balkan_christians_desc: "Build ties with Christian powers in the Balkans, Anatolia and the Caucasus."
 kob_pap_shield_of_balkans_title: "Shield of the Balkans"
 kob_pap_shield_of_balkans_desc: "Support Christian allies capable of resisting further expansion into the Balkans."
 kob_pap_holy_league_title: "The Holy League"
 kob_pap_holy_league_desc: "Unite major Catholic allies under a common military cause."
 kob_pap_eastern_bulwark_title: "The Eastern Bulwark"
 kob_pap_eastern_bulwark_desc: "Establish a durable Christian position in the Balkans."
 kob_pap_break_ottoman_advance_title: "Break the Ottoman Advance"
 kob_pap_break_ottoman_advance_desc: "End Ottoman dominance over the Christian lands of the Balkans."
 kob_pap_gate_to_africa_title: "The Gate to Africa"
 kob_pap_gate_to_africa_desc: "Establish a Papal foothold along the North African coast."
 kob_pap_break_the_crescent_title: "Break the Crescent"
 kob_pap_break_the_crescent_desc: "Secure the southern and eastern Mediterranean against the principal enemies of Catholic expansion."

 # Diplomacy and Jerusalem
 kob_pap_catholic_alliances_title: "Catholic Alliances"
 kob_pap_catholic_alliances_desc: "Build a dependable network of Catholic allies."
 kob_pap_support_knightly_orders_title: "Support the Knightly Orders"
 kob_pap_support_knightly_orders_desc: "Maintain strong relations with the surviving military orders of Christendom."
 kob_pap_papal_assistance_title: "Papal Assistance"
 kob_pap_papal_assistance_desc: "Prepare the Holy See to provide direct support to friendly Christian states."
 kob_pap_eastern_alliances_title: "Eastern Alliances"
 kob_pap_eastern_alliances_desc: "Extend Papal diplomacy toward Christian powers in the eastern Mediterranean."
 kob_pap_guardians_holy_sepulchre_title: "Guardians of the Holy Sepulchre"
 kob_pap_guardians_holy_sepulchre_desc: "Ensure that Jerusalem is held by Catholics and protected by friends of Rome."
 kob_pap_kingdom_must_endure_title: "The Kingdom Must Endure"
 kob_pap_kingdom_must_endure_desc: "Strengthen the Kingdom of Jerusalem so that it can survive as a Catholic state."
 kob_pap_road_to_holy_land_title: "The Road to the Holy Land"
 kob_pap_road_to_holy_land_desc: "Secure Catholic control of Jerusalem and open the way for a stronger presence in the Levant."
 kob_pap_levantine_crusade_title: "The Levantine Crusade"
 kob_pap_levantine_crusade_desc: "Expand Catholic control across the Levant and secure the approaches to Jerusalem."
 kob_pap_custodians_holy_land_title: "Custodians of the Holy Land"
 kob_pap_custodians_holy_land_desc: "Ensure that an independent Catholic Jerusalem is strong enough to defend the Holy Land."
 kob_pap_eternal_alliance_title: "The Eternal Alliance"
 kob_pap_eternal_alliance_desc: "Bind Rome and Jerusalem together through a lasting alliance."
 kob_pap_jerusalem_protected_title: "Jerusalem Protected"
 kob_pap_jerusalem_protected_desc: "Give Jerusalem the strength required to withstand its regional enemies."
 kob_pap_jerusalem_triumphant_title: "Jerusalem Triumphant"
 kob_pap_jerusalem_triumphant_desc: "Establish Jerusalem as a strong and enduring Catholic power in the Levant."
 kob_pap_a_catholic_empire_title: "A Catholic Empire"
 kob_pap_a_catholic_empire_desc: "Stand at the center of a powerful and united Catholic diplomatic order."

 # Rome and administration
 kob_pap_rebuild_papal_treasury_title: "Rebuild the Papal Treasury"
 kob_pap_rebuild_papal_treasury_desc: "Restore sound finances and eliminate dependence on loans."
 kob_pap_restore_curia_funding_title: "Restore Curia Funding"
 kob_pap_restore_curia_funding_desc: "Ensure that the Curia possesses the resources required for its responsibilities."
 kob_pap_new_st_peters_basilica_title: "The New Saint Peter's Basilica"
 kob_pap_new_st_peters_basilica_desc: "Transform Rome and Saint Peter's Basilica into a fitting center of the Catholic world."
 kob_pap_establish_vatican_library_title: "Establish the Vatican Library"
 kob_pap_establish_vatican_library_desc: "Strengthen Rome as a center of scholarship and preserve the knowledge of the Church."
 kob_pap_pontifical_universities_title: "Pontifical Universities"
 kob_pap_pontifical_universities_desc: "Expand higher education throughout the Papal territories."
 kob_pap_subiaco_press_title: "The Subiaco Press"
 kob_pap_subiaco_press_desc: "Use the printing press to strengthen Papal scholarship and administration."
 kob_pap_roman_administration_title: "Roman Administration"
 kob_pap_roman_administration_desc: "Maintain a stable government and modernize the administration of the Papal territories."
 kob_pap_taxation_of_patrimony_title: "Taxation of the Patrimony"
 kob_pap_taxation_of_patrimony_desc: "Develop a reliable fiscal base capable of supporting Papal ambitions."
 kob_pap_genoese_exchange_title: "The Genoese Exchange"
 kob_pap_genoese_exchange_desc: "Use Genoa as the principal commercial gateway of the Papal economy."
 kob_pap_develop_the_patrimony_title: "Develop the Patrimony"
 kob_pap_develop_the_patrimony_desc: "Invest in Rome and the principal cities of the Papal territories."
 kob_pap_capital_of_christendom_title: "Capital of Christendom"
 kob_pap_capital_of_christendom_desc: "Make Rome the foremost religious and administrative city of Catholic Europe."
 kob_pap_treasury_of_christendom_title: "Treasury of Christendom"
 kob_pap_treasury_of_christendom_desc: "Accumulate the resources expected of the financial center of the Catholic world."
 kob_pap_seat_of_universal_church_title: "Seat of the Universal Church"
 kob_pap_seat_of_universal_church_desc: "Raise Rome to the undisputed center of a prosperous and influential Holy See."

 # Counter-Reformation
 kob_pap_authority_holy_see_title: "Authority of the Holy See"
 kob_pap_authority_holy_see_desc: "Maintain religious unity and the prestige necessary to assert Papal authority."
 kob_pap_start_counter_reformation_title: "Begin the Counter-Reformation"
 kob_pap_start_counter_reformation_desc: "Respond decisively to the spread of religious division within Catholic Europe."
 kob_pap_council_of_trent_title: "The Council of Trent"
 kob_pap_council_of_trent_desc: "Bring the great Catholic council to a clear conclusion and reinforce the Church."
 kob_pap_back_catholic_powers_title: "Back the Catholic Powers"
 kob_pap_back_catholic_powers_desc: "Support Catholic allies in the struggle for the religious future of Europe."
 kob_pap_protector_catholic_realms_title: "Protector of Catholic Realms"
 kob_pap_protector_catholic_realms_desc: "Establish the Holy See as the diplomatic protector of the Catholic states."
 kob_pap_papal_intervention_title: "Papal Intervention"
 kob_pap_papal_intervention_desc: "Prepare Rome to intervene when Catholic interests and friendly realms are threatened."
 kob_pap_fight_heretics_title: "Fight the Heretics"
 kob_pap_fight_heretics_desc: "Strengthen Catholic military resolve against the major centers of heresy."
 kob_pap_catholic_americas_title: "The Catholic Americas"
 kob_pap_catholic_americas_desc: "Ensure that Catholic powers establish a lasting presence across the Americas."
 kob_pap_defender_catholic_league_title: "Defender of the Catholic League"
 kob_pap_defender_catholic_league_desc: "Stand as the principal defender of the Catholic cause in Europe."
 kob_pap_destroy_heretic_strongholds_title: "Destroy the Heretic Strongholds"
 kob_pap_destroy_heretic_strongholds_desc: "Break the remaining centers of organized religious opposition in the heart of Europe."
 kob_pap_orthodox_cooperation_title: "Orthodox Cooperation"
 kob_pap_orthodox_cooperation_desc: "Cooperate with Orthodox Christians where common interests require a united Christian front."
 kob_pap_universal_church_title: "The Universal Church"
 kob_pap_universal_church_desc: "Restore unity and place the Holy See at the center of Catholic Christendom."
 kob_pap_urbi_et_orbi_title: "Urbi et Orbi"
 kob_pap_urbi_et_orbi_desc: "Complete the Papal program in Italy, the Mediterranean and the wider Catholic world."
