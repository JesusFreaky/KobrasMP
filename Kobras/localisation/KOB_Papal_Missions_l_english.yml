 # KobrasMP — Papal State Mission Tree v2.2
 # Concise mission localisation. Guard-specific mechanics remain in KOB_Papal_Guard_l_english.yml.

 # Temporal core
 kob_pap_patrimony_of_st_peter_title: "Patrimony of Saint Peter"
 kob_pap_patrimony_of_st_peter_desc: "Secure the lands surrounding Rome and strengthen direct Papal rule in central Italy."
 kob_pap_neapolitan_question_title: "The Neapolitan Question"
 kob_pap_neapolitan_question_desc: "Settle the status of Naples and ensure that southern Italy cannot threaten the Papal position."
 kob_pap_secure_the_patrimony_title: "Secure the Patrimony"
 kob_pap_secure_the_patrimony_desc: "Consolidate our Italian possessions into a stable and defensible territorial base."
 kob_pap_balance_of_italy_title: "The Balance of Italy"
 kob_pap_balance_of_italy_desc: "Build enough influence or territorial strength to shape the balance of power in Italy."
 kob_pap_temporal_sword_title: "The Temporal Sword"
 kob_pap_temporal_sword_desc: "The Holy See must decide which temporal strategy will guide its relations with the great Catholic powers."

 # Imperial branch
 kob_pap_imperial_concordat_title: "Imperial Concordat"
 kob_pap_imperial_concordat_desc: "Establish a durable understanding with the Catholic Emperor."
 kob_pap_guard_the_imperial_church_title: "Guard the Imperial Church"
 kob_pap_guard_the_imperial_church_desc: "Stand beside the Empire in the defense of Catholic authority."
 kob_pap_two_swords_title: "The Two Swords"
 kob_pap_two_swords_desc: "Spiritual and imperial authority shall cooperate in defense of the Catholic order."
 kob_pap_imperial_venetian_question_title: "The Venetian Question"
 kob_pap_imperial_venetian_question_desc: "Settle our relationship with Venice without making its conquest necessary for Papal ambitions."
 kob_pap_imperial_genoese_question_title: "The Genoese Question"
 kob_pap_imperial_genoese_question_desc: "Secure Liguria and establish Genoa as the commercial axis of Papal Italy."
 kob_pap_imperial_united_italian_patrimony_title: "United Italian Patrimony"
 kob_pap_imperial_united_italian_patrimony_desc: "Bring the principal lands of Italy under a coherent Papal political order."
 kob_pap_imperial_kingdom_of_god_title: "The Kingdom of God"
 kob_pap_imperial_kingdom_of_god_desc: "Strengthen Rome and the Papal state until temporal authority matches its spiritual standing."
