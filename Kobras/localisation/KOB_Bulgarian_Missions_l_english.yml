l_english:
 kob_bul_master_balkans_title:0 "Masters of the Western Balkans"
 kob_bul_master_balkans_desc:0 "Bosnia, Croatia, Albania and the Adriatic coast must acknowledge Bulgarian supremacy if we are to become the unquestioned power of the peninsula."
 kob_bul_break_hungary_title:0 "Break the Hungarian Crown"
 kob_bul_break_hungary_desc:0 "The Hungarian realm has dominated the lands beyond the Danube for centuries. Seizing Transdanubia and Slovakia will open Central Europe to Bulgarian ambition."
 kob_bul_cross_carpathians_title:0 "Beyond the Carpathians"
 kob_bul_cross_carpathians_desc:0 "With Hungary broken, the road through the Carpathians lies open. Southern Poland and Red Ruthenia shall form our next frontier."
 kob_bul_polish_crown_title:0 "Challenge the Polish Crown"
 kob_bul_polish_crown_desc:0 "Our banners have crossed the Carpathians. Control of the Polish lands and the roads toward Prussia will establish Bulgaria as a power of Eastern Europe."
 kob_bul_empire_two_seas_title:0 "An Empire of Two Seas"
 kob_bul_empire_two_seas_desc:0 "From the Balkans to the Baltic approaches, Bulgarian authority now spans the great crossroads of Eastern Europe."

 kob_bul_balkan_administration:0 "Administration of the Balkans"
 kob_bul_balkan_administration_desc:0 "The integration of the western Balkans has given our officials valuable experience governing a diverse imperial realm."
 kob_bul_carpathian_administration:0 "Carpathian Administration"
 kob_bul_carpathian_administration_desc:0 "Institutions established beyond the Danube allow the Bulgarian state to absorb newly conquered lands more efficiently."
 kob_bul_polish_suzerainty:0 "Bulgarian-Polish Settlement"
 kob_bul_polish_suzerainty_desc:0 "Our victories in Poland have strengthened Bulgaria's influence among the courts of Europe."
 kob_bul_empire_two_seas_modifier:0 "Empire of Two Seas"
 kob_bul_empire_two_seas_modifier_desc:0 "The Bulgarian state has grown into a vast imperial structure spanning the Balkans, the Carpathian basin and the approaches to the Baltic."
